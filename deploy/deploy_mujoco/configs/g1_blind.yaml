# WMP g1_blind MuJoCo sim2sim (Isaac Gym train → MuJoCo play)
#
# Export first:
#   python deploy/deploy_mujoco/export_wmp_checkpoint.py \
#       --task=g1_blind --load_run=Jul25_23-32-07_ --checkpoint=100000
#
# Then run:
#   python deploy/deploy_mujoco/deploy_mujoco_wmp.py Jul25_23-32-07_

task: g1_blind
load_run: Jul25_23-32-07_
checkpoint: 100000

# MuJoCo scene: terrain=stripe (default) adds orange bars; terrain=flat uses unitree scene.xml
terrain: stripe
terrain_difficulty: 0.4
stripe_num: 4
stripe_min_gap: 2.2
stripe_max_gap: 5.0
terrain_seed: -1
xml_path: "{UNITREE_RL_GYM_ROOT}/resources/robots/g1_description/scene.xml"

simulation_duration: 60.0
simulation_dt: 0.002
control_decimation: 10   # 50 Hz control (matches Isaac dt=0.005, decimation=4)

# G1 12-DoF order: L pitch/roll/yaw, knee, ankle pitch/roll, then R
default_angles: [-0.1, 0.0, 0.0, 0.3, -0.2, 0.0,
                 -0.1, 0.0, 0.0, 0.3, -0.2, 0.0]
kps: [100, 100, 100, 150, 40, 40, 100, 100, 100, 150, 40, 40]
kds: [2, 2, 2, 4, 2, 2, 2, 2, 2, 4, 2, 2]

ang_vel_scale: 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
action_scale: 0.25
# G1 stage-2 style pause after a foot crosses & lands on a stripe
use_stop_and_go: true
stop_time_range: [2.0, 4.0]

cmd: [0.5, 0.0, 0.0]

# WMP g1_blind layout
privileged_dim: 47
prop_dim: 33
height_dim: 187
num_actions: 12
history_length: 5
history_step_dim: 42
wm_update_interval: 2
wm_feature_dim: 512

# Initial base height (pelvis z in scene.xml)
init_base_z: 0.793
